<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <!-- Viewport para design responsivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar - GeraLeads</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <h2>Já tem conta?</h2>
            <p>Se você já faz parte da nossa plataforma, clique no botão abaixo para fazer login.</p>
            <a href="/login"><button>LOGIN</button></a>
        </div>
        <div class="right">
            <div class="brand-logo" role="img" aria-label="Logo GeraLeads">
                <span class="brand-dark">Gera</span><span class="brand-accent">Leads</span>
            </div>
            <h2>Crie sua conta</h2>
            <form action="/registrar" method="post">
                <input type="text" name="nome" placeholder="Nome completo" required>
                <input type="email" name="email" placeholder="E-mail" required>
                <input type="text" name="cpf" placeholder="CPF" required>
                <input type="text" name="phone" placeholder="Telefone" required>
                <input type="password" name="password" placeholder="Crie uma senha" required>
                <input type="submit" value="SIGN UP">
            </form>
            {% if msg %}
                <p class="flash">{{ msg }}</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
